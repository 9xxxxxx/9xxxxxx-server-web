# Nginx 配置 - FastAPI + Next.js 架构
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 客户端最大上传大小 (支持数据文件上传)
    client_max_body_size 50M;

    # FastAPI 后端 API
    location /api {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # FastAPI 静态文件 (上传的图片等)
    # Uploads Persistence: Serve directly from /var/www/uploads
    # 使用 ^~ 修饰符确保优先于 /static 匹配
    location ^~ /static/uploads/ {
        alias /var/www/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Other static files from backend
    location /static {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Frontend Proxy (Next.js Standalone)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js 静态文件托管 (托管 build 导出的 out 目录)
    # root /var/www/app/out;
    # index index.html;

    # 静态路由支持 (Next.js export 需要)
    # location / {

        # Fix for Next.js 13+ App Router RSC payload requests in static export
        # Browsers request ...__PAGE__.txt but files are ...txt
        # rewrite ^/(.*)\.__PAGE__\.txt$ /$1.txt last;
    # }

    # Next.js 静态资源缓存 (_next/static 下的文件)
    location /_next/static {
        alias /var/www/app/app/.next/static;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 图片/字体资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 日志
    access_log /var/log/nginx/app_access.log;
    error_log /var/log/nginx/app_error.log;
}
